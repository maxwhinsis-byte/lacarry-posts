<!doctype html>
<html lang="es" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="./gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a0b2e}
#root{position:relative;width:1080px;height:1920px;font-family:'Poppins',sans-serif;
 background:radial-gradient(circle at 50% 30%,#ff7a00 0%,#c2410c 35%,#2a0f4a 100%)}
#logo{position:absolute;left:290px;top:420px;width:500px}
#t1{position:absolute;left:0;width:1080px;top:1020px;text-align:center;color:#fff;font-size:92px;font-weight:700;line-height:1.1}
#t2{position:absolute;left:0;width:1080px;top:1300px;text-align:center;color:#ffd60a;font-size:56px;font-weight:600}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
 <img id="logo" class="clip" src="./logo.png" data-start="0" data-duration="5" data-track-index="0"/>
 <div id="t1" class="clip" data-start="0" data-duration="5" data-track-index="1">Pedí por WhatsApp<br/>y te lo llevamos</div>
 <div id="t2" class="clip" data-start="0" data-duration="5" data-track-index="2">099 387 249</div>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.fromTo("#logo",{opacity:0,scale:.6},{opacity:1,scale:1,duration:.8,ease:"back.out(1.6)"},0)
  .fromTo("#t1",{opacity:0,y:40},{opacity:1,y:0,duration:.6},.7)
  .fromTo("#t2",{opacity:0,y:40},{opacity:1,y:0,duration:.6},1.3);
window.__timelines["main"]=tl; tl.seek(0);
</script>
</body></html>
